<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="lc-g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7480e8"/>
      <stop offset="50%" stop-color="#5ec2dc"/>
      <stop offset="100%" stop-color="#5ec2a8"/>
    </linearGradient>
    <radialGradient id="lc-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#5ec2dc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7480e8"/>
    </radialGradient>
  </defs>
  <!-- observability envelope -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="url(#lc-g)" stroke-width="0.9" stroke-opacity="0.35"/>
  <!-- 3 aurora petals, 120° symmetric -->
  <g fill="url(#lc-g)">
    <path d="M 16 3.6 C 20.6 7.6, 20.9 12.6, 16 15.4 C 11.1 12.6, 11.4 7.6, 16 3.6 Z"/>
    <path d="M 16 3.6 C 20.6 7.6, 20.9 12.6, 16 15.4 C 11.1 12.6, 11.4 7.6, 16 3.6 Z" transform="rotate(120 16 16)"/>
    <path d="M 16 3.6 C 20.6 7.6, 20.9 12.6, 16 15.4 C 11.1 12.6, 11.4 7.6, 16 3.6 Z" transform="rotate(240 16 16)"/>
  </g>
  <!-- lumen core -->
  <circle cx="16" cy="16" r="3.2" fill="url(#lc-core)"/>
</svg>
